<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Directorio de Funcionarios</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-hero">
      <div class="brand auth-brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <div>
          <strong>Directorio</strong>
          <small>de Funcionarios</small>
        </div>
      </div>

      <div class="auth-copy">
        <h1>Acceso al directorio del equipo</h1>
        <p>Inicia sesión con tu cuenta para consultar, registrar, editar y administrar funcionarios.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-card-head">
        <h2>Iniciar sesión</h2>
        <p class="muted">Ingresa tus credenciales para continuar.</p>
      </div>

      <div class="auth-alert" id="authAlert" hidden></div>

      <!-- FORMULARIO LOGIN (procesado por Spring Security en POST /login) -->
      <form id="formLogin" method="post" action="/login" class="auth-form">
        <div class="field">
          <label for="loginUser">Usuario</label>
          <input type="text" id="loginUser" name="username" placeholder="Ingresa tu usuario" required autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="loginPass">Contraseña</label>
          <input type="password" id="loginPass" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Entrar al directorio</button>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
